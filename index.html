<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Dīwān</title>
<meta name="description" content="One page over five apps — what is outstanding, what to do next, and every log in one place.">
<meta name="theme-color" content="#0a0b0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dīwān">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<main id="app"></main>

<div id="sessbar" hidden></div>
<div id="sesspanel" hidden></div>
<div id="scrim" hidden></div>
<aside id="drawer" hidden aria-label="Apps and sections"></aside>
<button id="menu" aria-label="Open menu" aria-expanded="false" hidden>☰</button>

<nav class="nav">
  <div class="nav-in">
    <a href="#/"      data-nav="today"><span class="ico" aria-hidden="true">◈</span><span>Today</span></a>
    <a href="#/log"   data-nav="log"><span class="ico" aria-hidden="true">▦</span><span>Log</span></a>
    <a href="#/apps"  data-nav="apps"><span class="ico" aria-hidden="true">◫</span><span>Apps</span></a>
    <a href="#/data"  data-nav="data"><span class="ico" aria-hidden="true">↧</span><span>Data</span></a>
  </div>
</nav>

<script>
/* The last resort: a page that dies before first paint must SAY SO. A blank
   register with working navigation looks like a broken app and reads like
   nothing; the actual error on screen is a bug report that writes itself. */
window.addEventListener('error', e => {
  const app = document.getElementById('app');
  if (app && !app.childElementCount) {
    const d = document.createElement('div');
    d.style.cssText = 'padding:40px 20px;font:13px/1.6 monospace;color:#e08a7a;word-break:break-all';
    d.textContent = 'Boot failed: ' + (e.message || e.type) + ' @ ' +
      String(e.filename || '').split('/').pop() + ':' + (e.lineno || '?');
    app.appendChild(d);
  }
});
window.addEventListener('unhandledrejection', e => {
  const app = document.getElementById('app');
  if (app && !app.childElementCount) {
    const d = document.createElement('div');
    d.style.cssText = 'padding:40px 20px;font:13px/1.6 monospace;color:#e08a7a;word-break:break-all';
    d.textContent = 'Boot failed (async): ' + String(e.reason && e.reason.stack || e.reason).slice(0, 400);
    app.appendChild(d);
  }
});
</script>
<script type="module" src="js/app.js"></script>
</body>
</html>
